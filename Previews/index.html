<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading preview…</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071a38;color:#fff}
#status{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
#status a{color:#fff}
</style>
</head>
<body>
<div id="status">Loading your preview…</div>

<script type="module">
const status=document.getElementById('status');

function titleCase(value){
  return String(value||'')
    .replace(/[-_]+/g,' ')
    .replace(/\b\w/g,c=>c.toUpperCase());
}

function decodeData(value){
  if(!value) return {};
  try{
    const normalized=value.replace(/-/g,'+').replace(/_/g,'/');
    const raw=atob(normalized+'='.repeat((4-normalized.length%4)%4));
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch{
    try{return JSON.parse(decodeURIComponent(value))}catch{return {}}
  }
}

function readSessionPreview(siteKey){
  const key=String(siteKey||'').trim();
  if(!key.startsWith('SHS-')) return null;
  try{
    const raw=sessionStorage.getItem(`steadyhands.preview.${key}`);
    return raw?JSON.parse(raw):null;
  }catch{
    return null;
  }
}

function sampleServices(slug){
  const groups=[
    [/clean|janitor/,['Residential Cleaning','Deep Cleaning','Move-Out Cleaning','Recurring Service']],
    [/landscap|lawn|tree|garden|sod|irrigation/,['Lawn Care','Landscape Maintenance','Cleanups','Outdoor Projects']],
    [/plumb|water-well|septic/,['Repairs','Installations','Maintenance','Emergency Service']],
    [/electric/,['Electrical Repairs','Installations','Troubleshooting','Upgrades']],
    [/roof/,['Roof Repair','Inspections','Replacement','Maintenance']],
    [/hvac/,['AC Repair','Heating Service','Maintenance','New Systems']],
    [/barber|salon|beauty|spa|massage|tattoo/,['Appointments','Signature Services','Consultations','Special Packages']],
    [/restaurant|cafe|coffee|bakery|deli|food/,['Fresh Favorites','House Specials','Catering','Takeout']],
    [/auto|tire|truck|transmission|towing|vehicle|car-wash/,['Diagnostics','Repairs','Maintenance','Inspections']],
    [/dent|medical|clinic|chiropr|therapy|optom|podiat|wellness|hearing/,['Consultations','Appointments','Treatment Plans','Follow-Up Care']],
    [/real-estate|property|apartments/,['Property Search','Listings','Consultations','Local Guidance']],
    [/photo|graphic|artist|event|musician|dance/,['Consultations','Custom Packages','Events','Bookings']],
    [/construction|remodel|painting|flooring|concrete|fence|deck|handyman|carpentry|cabinet/,['Consultations','Custom Projects','Repairs','Installations']]
  ];
  return groups.find(([re])=>re.test(slug))?.[1]||['Consultations','Custom Service','Local Support','Request a Quote'];
}

function sampleSite(slug,record){
  const category=record.categoryLabel||titleCase(slug);
  const businessName=record.businessName||record.companyName||`Sample ${category} Co.`;
  const services=(Array.isArray(record.services)?record.services:String(record.services||'').split(/[\n,]/))
    .map(v=>String(v).trim()).filter(Boolean);
  const about=record.about||record.description||record.about_business||'';

  return {
    title:businessName,
    business_name:businessName,
    name:businessName,
    description:about||`Friendly, reliable ${category.toLowerCase()} service with straightforward communication and quality work.`,
    phone:record.phone||record.public_phone||'(702) 555-0147',
    email:record.public_email||'hello@example.com',
    address:record.address||record.address_or_service_area||'Las Vegas, Nevada',
    category,
    services:services.length?services:sampleServices(slug),
    paragraphs:[
      about||`${businessName} helps local customers with dependable ${category.toLowerCase()} services.`,
      'We keep the process simple, communicate clearly, and focus on work that fits your needs.',
      'Reach out for availability, pricing, or a quick estimate.'
    ],
    links:[
      ...(record.instagram?[{text:'Instagram',href:record.instagram}]:[]),
      ...(record.facebook?[{text:'Facebook',href:record.facebook}]:[]),
      ...(record.tiktok?[{text:'TikTok',href:record.tiktok}]:[]),
      ...(record.yelp?[{text:'Yelp',href:record.yelp}]:[]),
      ...(record.google?[{text:'Google',href:record.google}]:[])
    ],
    sitekey:record.siteKey||record.site_key||'SAMPLE',
    site_key:record.siteKey||record.site_key||'SAMPLE',
    slug,
    template_key:slug,
    template:slug
  };
}

function prepareTemplate(source){
  return source
    .replace(/site\.services\[:9\]/g,'site.services')
    .replace(/site\.paragraphs\[:3\]/g,'site.paragraphs')
    .replace(/not\s+link\.href\.startswith\(["']tel:["']\)/g,'not link.is_tel')
    .replace(/link\.href\.startswith\(["']tel:["']\)/g,'link.is_tel')
    .replace(/{{\s*site\.description\s+or\s*\(site\.paragraphs\[0\]\s+if\s+site\.paragraphs\s+else\s+site\.category\)\s*}}/gs,'{{ site.hero_copy }}')
    .replace(/{{\s*site\.paragraphs\[1\]\s+if\s+site\.paragraphs\|length\s*>\s*1\s+else\s*\(\s*site\.paragraphs\[0\]\s+if\s+site\.paragraphs\s+else\s+site\.description\s*\)\s*}}/gs,'{{ site.paragraph_two }}')
    .replace(/{{\s*site\.paragraphs\[0\]\s+if\s+site\.paragraphs\s+else\s+site\.description\s*}}/gs,'{{ site.paragraph_one }}');
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=resolve;
    s.onerror=()=>reject(new Error('Could not load preview renderer.'));
    document.head.appendChild(s);
  });
}

try{
  const names=['templates.br.00','templates.br.01','templates.br.02','templates.br.03'];
  const parts=await Promise.all(names.map(async n=>{
    const r=await fetch(n,{cache:'force-cache'});
    if(!r.ok) throw new Error('Could not load template bundle.');
    return r.text();
  }));

  const raw=atob(parts.join('').replace(/\s+/g,''));
  const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);

  const brotliPromise=await import('https://unpkg.com/@kyr0/brotli-wasm@3.1.0/index.web.js?module').then(m=>m.default);
  const brotli=await brotliPromise;
  const json=new TextDecoder().decode(brotli.decompress(bytes));
  const templates=JSON.parse(json);

  const params=new URLSearchParams(location.search);
  const slug=(params.get('template')||'generic').toLowerCase();
  const source=templates[slug]||templates.generic;
  if(!source) throw new Error('Template not found.');

  const siteKey=params.get('sitekey')||'';
  const record=readSessionPreview(siteKey)||decodeData(params.get('data'));
  if(!record.siteKey && siteKey) record.siteKey=siteKey;

  const site=sampleSite(slug,record);
  site.hero_copy=site.description||site.paragraphs[0]||site.category;
  site.paragraph_one=site.paragraphs[0]||site.description;
  site.paragraph_two=site.paragraphs[1]||site.paragraphs[0]||site.description;
  site.links=site.links.map(link=>({...link,is_tel:String(link.href||'').startsWith('tel:')}));

  await loadScript('https://cdn.jsdelivr.net/npm/nunjucks@3.2.4/browser/nunjucks.min.js');

  const prepared=prepareTemplate(source);
  const rendered=window.nunjucks.renderString(prepared,{site,niche:site.category});

  document.open();
  document.write(rendered);
  document.close();
}catch(err){
  console.error(err);
  status.innerHTML='<div><h1>Preview unavailable</h1><p>We could not load this preview. Please try again or check the site key.</p><p><a href="../preview.html">Back to Preview</a></p></div>';
}
</script>
</body>
</html>
