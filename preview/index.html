<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websites - Steady Hands Operation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -1px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .site-card {
            aspect-ratio: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .site-card:hover {
            background: #222;
            border-color: #555;
            transform: translateY(-4px);
        }

        .site-card h2 {
            font-size: 1.5rem;
            font-weight: 500;
            word-break: break-word;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        .empty-state h2 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .site-card {
                aspect-ratio: auto;
                min-height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Websites</h1>
        </header>

        <div class="gallery" id="gallery">
            <div class="empty-state" style="grid-column: 1 / -1;">
                <h2>Loading websites...</h2>
            </div>
        </div>
    </div>

    <script>
        const sites = [
            { name: 'Del Carmen Hair Salon', path: 'DelCarmeHairSalon' },
            { name: 'Shop Vezzy', path: 'SHOPVEZZY' },
            { name: 'Studio 47 Hair Salon', path: 'Studio47HairSalon' },
            { name: 'Favorite Place to Shop', path: 'favoriteplacetoshop' },
            { name: 'Green House Water Heaters', path: 'GreenHouseWaterHeaters' }
        ];

        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        if (sites.length === 0) {
            gallery.innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <h2>No websites yet</h2>
                    <p>Add folders to the preview directory to see them here.</p>
                </div>
            `;
        } else {
            sites.forEach(site => {
                const card = document.createElement('a');
                card.href = `./${site.path}/`;
                card.className = 'site-card';
                card.innerHTML = `<h2>${site.name}</h2>`;
                gallery.appendChild(card);
            });
        }
    </script>
</body>
</html>
